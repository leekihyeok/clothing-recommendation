  """화면의 코스 버전을 고정 사본으로 저장하고 공유 링크용 id를 준다"""
  shareCourse(courseId: ID!, stopIds: [ID!], variant: Int!): ID!

  """같이 가기 시작: 이 코스의 조건과 내 취향(코스의 스타일·누구 옷·예산)으로 링크를 만든다"""
  startCourseGroup(courseId: ID!, name: String): CourseGroup!

  """되돌리기: 이 버전의 마지막 고치기 전으로 (서버에도 저장, 새로고침해도 그대로)"""
  undoCourseEdit(courseId: ID!, variant: Int!): CourseEditResult!

  """코스 저장 취소"""
  unsaveCourse(courseId: ID!): Boolean!

  """프로필 사진 바꾸기: 브라우저에서 줄인 사진(base64). 새 사진 주소를 준다"""
  updateAvatar(imageBase64: String!): String!

  """닉네임 바꾸기 (2~20자). 다음 카카오 로그인 때도 유지"""
  updateNickname(nickname: String!): String!

  """사장님: 영업시간·소개·인스타그램·전화 고치기"""
  updateShopInfo(input: ShopInfoInput!, shopId: ID!): Boolean!

  """걷기 모드 시작·끝 (통계용, 위치는 보내지 않음): action = start | finish"""
  walkEvent(action: String!, arrived: Int, courseId: ID!, stops: Int): Boolean!
}

