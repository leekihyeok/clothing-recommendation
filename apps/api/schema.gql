  url: String!
}

type ShopsInBounds {
  shops: [MapShop!]!

  """영역 안 전체 수 (limit 때문에 일부만 왔을 수 있음)"""
  total: Int!
}

"""비슷한 가게 한 곳 (가게 화면 "여기 좋았다면")"""
type SimilarShop {
  category: String!

  """이 가게에서 떨어진 거리 (직선, m)"""
  distanceM: Int!
  id: ID!
  kind: String!
  lat: Float!
  lng: Float!
  name: String!

  """왜 비슷한가 한 줄 ("빈티지·워크웨어 쪽이 비슷해요")"""
  reason: String!
}

type SourcePost {
  postedOn: String

  """블로그 | 카페 | 웹문서 | 영상"""
  source: String!
  title: String!
  url: String!
}

type StyleScore {
  score: Int!
  style: String!
}

type StyleTag {
  score: Int!
  style: String!
}

type StyleWeight {
  id: String!
  weight: Float!
}

input StyleWeightInput {
  id: String!
  weight: Float! = 1
}

type TasteStyle {
  style: String!

  """-1~1"""
  weight: Float!
}

"""대중교통 경로 (ODsay). found=false면 카카오맵 링크로 안내"""
type TransitRoute {
  fare: Int
  found: Boolean!

  """카카오맵 길찾기 (항상)"""
  kakaoUrl: String!
  minutes: Int!
  note: String
  steps: [TransitStep!]!
  transfers: Int!
  walkM: Int!
}

type TransitStep {
  from: String

  """2호선, 간선 472, 도보"""
  line: String!
  minutes: Int!

  """subway | bus | walk"""
  mode: String!
  stops: Int
  to: String
}