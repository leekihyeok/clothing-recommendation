[project]
name = "cr-model"
version = "0.0.0"
description = "Model service: prompt parsing, course optimization, shop data pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*", "ai*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
